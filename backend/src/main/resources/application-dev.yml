spring:
  datasource:
    url: jdbc:h2:file:./data/kaoyan_buddy_dev;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: true
      path: /h2-console
  ai:
    model:
      chat: none

app:
  cors:
    allowed-origins: http://localhost:5173
